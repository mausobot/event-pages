<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bowleys at the Plough - Lunch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
.container{max-width:480px;width:100%;padding:20px}
.invite-img{width:100%;border-radius:16px;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
h1{font-size:1.6rem;color:#82b1ff;margin-bottom:8px;line-height:1.3}
.detail{display:flex;align-items:flex-start;gap:12px;margin:16px 0;padding:14px 16px;background:#16213e;border-radius:12px;border-left:3px solid #82b1ff}
.detail .icon{font-size:1.4rem;flex-shrink:0;margin-top:2px}
.detail .text{font-size:0.95rem;line-height:1.5}
.detail .label{color:#888;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
a{color:#82b1ff;text-decoration:none}
a:hover{text-decoration:underline}
.booking-box{background:linear-gradient(135deg,#1b5e20,#388e3c);padding:18px;border-radius:14px;text-align:center;margin:20px 0}
.booking-box .status{font-size:1.1rem;font-weight:700;color:#fff}
.footer{text-align:center;color:#555;font-size:0.75rem;margin-top:32px;padding-bottom:20px}
</style>
</head>
<body>
<div class="container">
<img src="invite.jpg" alt="Booking Confirmation" class="invite-img">

<h1>🍽️ Bowleys at the Plough</h1>

<div class="detail">
<span class="icon">📅</span>
<div class="text">
<div class="label">Date & Time</div>
Sunday 8 March 2026, 2:00pm
</div>
</div>

<div class="detail">
<span class="icon">👥</span>
<div class="text">
<div class="label">Party Size</div>
4 guests — Bowleys Dining Room
</div>
</div>

<div class="detail">
<span class="icon">📍</span>
<div class="text">
<div class="label">Location</div>
Bowleys at the Plough<br>
<a href="https://www.google.com/maps/search/?api=1&query=Bowleys+at+the+Plough" target="_blank">📍 Open in Google Maps</a>
</div>
</div>

<div class="booking-box">
<div class="status">✅ Booking Confirmed</div>
<div style="font-size:0.85rem;opacity:0.9;margin-top:6px">Booked via OpenTable by Kerrie</div>
</div>

<div class="footer">Event page powered by event-pages</div>
</div>
</body>
</html>
