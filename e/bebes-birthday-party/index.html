<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bebe's Birthday Party - Soar Trampoline Park</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
.container{max-width:480px;width:100%;padding:20px}
.invite-img{width:100%;border-radius:16px;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
h1{font-size:1.6rem;color:#ff6b9d;margin-bottom:8px;line-height:1.3}
.detail{display:flex;align-items:flex-start;gap:12px;margin:16px 0;padding:14px 16px;background:#16213e;border-radius:12px;border-left:3px solid #ff6b9d}
.detail .icon{font-size:1.4rem;flex-shrink:0;margin-top:2px}
.detail .text{font-size:0.95rem;line-height:1.5}
.detail .label{color:#888;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
a{color:#82b1ff;text-decoration:none}
a:hover{text-decoration:underline}
.waiver-box{background:linear-gradient(135deg,#6c2d5a,#a8457e);padding:18px;border-radius:14px;text-align:center;margin:20px 0}
.waiver-box a{color:#fff;font-size:1.1rem;font-weight:700}
.footer{text-align:center;color:#555;font-size:0.75rem;margin-top:32px;padding-bottom:20px}
</style>
</head>
<body>
<div class="container">
<img src="invite.jpg" alt="Party Invitation" class="invite-img">

<h1>🎉 Bebe's Birthday Party</h1>

<div class="detail">
<span class="icon">📅</span>
<div class="text">
<div class="label">Date & Time</div>
Saturday 28 March 2026 at 11:00 AM
</div>
</div>

<div class="detail">
<span class="icon">📍</span>
<div class="text">
<div class="label">Location</div>
Soar Trampoline Park<br>
Courtney Road, Gillingham<br>
<a href="https://maps.google.com/?q=Soar+Trampoline+Park+Courtney+Road+Gillingham" target="_blank">Open in Maps →</a>
</div>
</div>

<div class="detail">
<span class="icon">👤</span>
<div class="text">
<div class="label">Contact</div>
Claire Weekes — <a href="tel:+447525257548">07525 257548</a>
</div>
</div>

<div class="waiver-box">
⚠️ Waivers required<br>
<a href="https://waiver.roller.app" target="_blank">Complete waiver on roller.app →</a>
</div>

<div class="footer">Added to Kerrie and Neill calendar by Mausobot 🤖</div>
</div>
</body>
</html>
